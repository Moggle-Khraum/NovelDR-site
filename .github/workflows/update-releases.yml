name: Update releases feed

on:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | {tag_name, name, published_at, html_url, body, prerelease}]' \
            > releases.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git diff --staged --quiet || (git commit -m "Update releases feed" && git push origin HEAD:${{ github.event.repository.default_branch }})
